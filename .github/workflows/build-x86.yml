name: Build X86 MMDVM(Full Features)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: mmdvm-src

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git subversion libssl-dev gettext unzip zlib1g-dev file python3 python3-setuptools wget

      - name: Download OpenWrt SDK
        run: |
          wget https://downloads.openwrt.org/releases/23.05.3/targets/x86/64/openwrt-sdk-23.05.3-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          tar -xf openwrt-sdk-*.tar.xz
          mv openwrt-sdk-*/ sdk
          
      - name: Setup Feeds and Compile (Full Features)
        run: |
          cd sdk
          export TERM=xterm
          
          cp feeds.conf.default feeds.conf
          echo "src-git mmdvm file://$GITHUB_WORKSPACE/mmdvm-src" >> feeds.conf
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p mmdvm
          make defconfig
          
          echo "=== 强制预编译缺失的依赖库 ==="
          make package/libs/nlohmannjson/compile V=s || true
          make package/libs/libmosquitto/compile V=s || true
          make package/libs/libcurl/compile V=s || true
          
          echo "=== 编译全功能 MMDVM 套件 ==="
          make package/mmdvm-host/compile V=s || true
          make package/dmr-gateway/compile V=s || true
          make package/p25-clients/compile V=s || true
          make package/ysf-clients/compile V=s || true
          make package/nxdn-clients/compile V=s || true
          make package/ircddb-gateway/compile V=s || true
          make package/dapnet-gateway/compile V=s || true
          make package/mmdvm-luci/compile V=s || true
          
      - name: Upload ipk
        uses: actions/upload-artifact@v4
        with:
          name: MMDVM-X86-Full
          path: sdk/bin/packages/x86_64/mmdvm/*.ipk
