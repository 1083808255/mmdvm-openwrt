name: Build dmr-gateway

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: mmdvm-src

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git subversion libssl-dev gettext unzip zlib1g-dev file python3 python3-setuptools wget

      - name: Download OpenWrt SDK for MT7628 (mipsel_24kc)
        run: |
          wget https://downloads.openwrt.org/releases/23.05.3/targets/ramips/mt76x8/openwrt-sdk-23.05.3-ramips-mt76x8_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          tar -xf openwrt-sdk-23.05.3-ramips-mt76x8_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          mv openwrt-sdk-23.05.3-ramips-mt76x8_gcc-12.3.0_musl.Linux-x86_64 sdk
          
      - name: Setup Feeds and Compile
        run: |
          cd sdk
          cp feeds.conf.default feeds.conf
          echo "src-git mmdvm file://$GITHUB_WORKSPACE/mmdvm-src" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p mmdvm
          make package/dmr-gateway/compile V=s

      - name: Upload ipk
        uses: actions/upload-artifact@v4
        with:
          name: dmr-gateway-mipsel_24kc
          path: sdk/bin/packages/mipsel_24kc/mmdvm/*.ipk
