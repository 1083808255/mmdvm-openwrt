name: Build dmr-gateway

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: mt76x8
            arch: mipsel_24kc
            sdk_url: https://downloads.openwrt.org/releases/23.05.3/targets/ramips/mt76x8/openwrt-sdk-23.05.3-ramips-mt76x8_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          - target: x86
            arch: x86_64
            sdk_url: https://downloads.openwrt.org/releases/23.05.3/targets/x86/64/openwrt-sdk-23.05.3-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: mmdvm-src

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git subversion libssl-dev gettext unzip zlib1g-dev file python3 python3-setuptools wget

      - name: Download OpenWrt SDK (${{ matrix.target }})
        run: |
          wget ${{ matrix.sdk_url }}
          tar -xf openwrt-sdk-*.tar.xz
          mv openwrt-sdk-*/ sdk
          
      - name: Setup Feeds and Compile
        run: |
          cd sdk
          export TERM=xterm
          
          cp feeds.conf.default feeds.conf
          echo "src-git mmdvm file://$GITHUB_WORKSPACE/mmdvm-src" >> feeds.conf
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p mmdvm
          
          make defconfig
          
          echo "=== 强制打包 dmr-gateway 源码包，方便打补丁 ==="
          make package/dmr-gateway/download V=s
          make package/dmr-gateway/prepare V=s
          
          echo "=== 强行给旧源码打上兼容 GCC12 的补丁 ==="
          # 自动寻找源码目录
          DMR_DIR=$(find build_dir -type d -name "DMRGateway-*" | head -n 1)
          if [ -n "$DMR_DIR" ]; then
            echo "找到源码目录: $DMR_DIR"
            # 给所有 cpp 文件强制加上 cstring 和 cstdio 头文件
            find "$DMR_DIR" -name "*.cpp" -exec sed -i '1i #include <cstring>\n#include <cstdio>' {} +
          fi
          
          echo "=== 开始正式编译（去掉了 || true，必须成功） ==="
          make package/dmr-gateway/compile V=s
          make package/mmdvm-host/compile V=s || true
          
          echo "=== 检查是否成功生成 ipk ==="
          ls -la bin/packages/${{ matrix.arch }}/mmdvm/ | grep dmr-gateway

      - name: Upload ipk
        uses: actions/upload-artifact@v4
        with:
          name: MMDVM-${{ matrix.arch }}
          path: sdk/bin/packages/${{ matrix.arch }}/mmdvm/*.ipk
