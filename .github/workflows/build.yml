name: Build dmr-gateway

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with SDK
        uses: openwrt/gh-action-sdk@v5
        env:
          ARCH: mipsel_24kc-v19.07.10
          FEEDNAME: mmdvm
          PACKAGES: dmr-gateway
          NO_REFRESH_CHECK: true

      - name: Upload ipk
        uses: actions/upload-artifact@v4
        with:
          name: dmr-gateway-mipsel_24kc
          path: bin/packages/mipsel_24kc/mmdvm/*.ipk
