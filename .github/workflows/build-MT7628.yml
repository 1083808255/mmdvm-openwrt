name: Build MMDVM (MT7628 DMR Only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: mmdvm-src

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git subversion libssl-dev gettext unzip zlib1g-dev file python3 python3-setuptools wget

      - name: Download OpenWrt SDK
        run: |
          wget https://downloads.openwrt.org/releases/23.05.3/targets/ramips/mt76x8/openwrt-sdk-23.05.3-ramips-mt76x8_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          tar -xf openwrt-sdk-*.tar.xz
          mv openwrt-sdk-*/ sdk
          
      - name: Setup Feeds and Compile (DMR Only)
        run: |
          cd sdk
          export TERM=xterm
          
          cp feeds.conf.default feeds.conf
          echo "src-git mmdvm file://$GITHUB_WORKSPACE/mmdvm-src" >> feeds.conf
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p mmdvm
          make defconfig
          
          echo "=== 强制预编译缺失的依赖库 ==="
          make package/libs/nlohmannjson/compile V=s || true
          make package/libs/libmosquitto/compile V=s || true
          make package/libs/libcurl/compile V=s || true
          
          echo "=== 仅编译纯 DMR 核心包 ==="
          make package/mmdvm-host/compile V=s || true
          make package/dmr-gateway/compile V=s || true
          make package/mmdvm-luci/compile V=s || true

      - name: Upload ipk
        uses: actions/upload-artifact@v4
        with:
          name: MMDVM-MT7628-DMR-Only
          path: sdk/bin/packages/mipsel_24kc/mmdvm/*.ipk
