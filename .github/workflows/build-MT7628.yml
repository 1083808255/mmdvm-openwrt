name: Build MT7628 MMDVM (DMR mode Only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: mmdvm-src

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git subversion libssl-dev gettext unzip zlib1g-dev file python3 python3-setuptools wget zstd

      - name: Download OpenWrt SDK
        run: |
          wget https://downloads.openwrt.org/releases/24.10.5/targets/ramips/mt76x8/openwrt-sdk-24.10.5-ramips-mt76x8_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          tar --use-compress-program=unzstd -xf openwrt-sdk-*.tar.zst
          mv openwrt-sdk-*/ sdk
          
      - name: Setup Feeds and Compile (DMR Only)
        run: |
          cd sdk
          export TERM=xterm
          
          cp feeds.conf.default feeds.conf
          echo "src-git mmdvm file://$GITHUB_WORKSPACE/mmdvm-src" >> feeds.conf
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p mmdvm
          make defconfig
          
          echo "=== 编译纯 DMR 核心包 ==="
          make package/mmdvm-host/compile V=s || true
          make package/dmr-gateway/compile V=s || true

      - name: Collect and Upload IPKs
        run: |
          DEST_DIR="ipk/ipk-mt7628/build"
          
          # 先清空旧文件
          rm -rf "$DEST_DIR"/*
          mkdir -p "$DEST_DIR"
          
          # 复制包
          cp sdk/bin/packages/mipsel_24kc/*/*.ipk "$DEST_DIR/" || true
          
          echo "=== 生成带正确 Architecture 的 Packages 索引文件 ==="
          cd "$DEST_DIR"
          echo "Architecture: mipsel_24kc" > Packages
          for f in *.ipk; do
            if [ -f "$f" ]; then
              echo "Package: ${f%%_*}"
              echo "Version: $(echo $f | cut -d_ -f2)"
              echo "Architecture: mipsel_24kc"
              echo "Filename: $f"
              echo "Size: $(stat -c %s $f)"
              echo "Description: Auto generated package $f"
              echo ""
            fi
          done >> Packages
          gzip -c Packages > Packages.gz

      - name: Upload Artifact (for download)
        uses: actions/upload-artifact@v4
        with:
          name: MMDVM-MT7628-DMR-Only
          path: sdk/bin/packages/mipsel_24kc/*/*.ipk

      - name: Auto Commit to Repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build: Clean and Update MT7628 IPKs"
          branch: master
          file_pattern: ipk/**/*
